name: Centaurix Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # Never publish debug-signed or unsigned APKs as updates.
      - name: Check permanent signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CENTAURIX_SIGNING_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.CENTAURIX_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEY_PASSWORD" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release signing not configured. Add CENTAURIX_SIGNING_KEYSTORE_BASE64 and CENTAURIX_SIGNING_PASSWORD in repository Actions secrets."
              exit 1
            fi
            echo "::notice::Signed APK skipped until the two signing secrets are configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match v$VERSION from app/build.gradle.kts."
            exit 1
          fi

      - name: Decode private signing key
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CENTAURIX_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/centaurix-release.p12"
          test -s "$RUNNER_TEMP/centaurix-release.p12"

      - name: Build permanently signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          CENTAURIX_KEYSTORE_FILE: ${{ runner.temp }}/centaurix-release.p12
          CENTAURIX_SIGNING_PASSWORD: ${{ secrets.CENTAURIX_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature and package APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          mkdir -p dist
          cp "$APK" "dist/Centaurix-$VERSION.apk"
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          unzip -t "$APK" | tail -n 2

      - name: Upload signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Centaurix-SIGNED-APK-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish signed GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Centaurix for Android — release-signed APK.
            Updates require the same permanent signing key and an increased versionCode.
            Verify Bluetooth functionality on the actual BT200 hardware.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove temporary key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/centaurix-release.p12"
