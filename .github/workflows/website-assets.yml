name: Centaurix Website Assets

on:
  push:
    branches: [main]
    paths:
      - 'docs/assets/*.svg'
      - 'tools/render_site_assets.py'
      - '.github/workflows/website-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-assets-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'CairoSVG>=2.7,<3'
      - name: Render responsive site illustrations
        run: python tools/render_site_assets.py
      - name: Commit generated images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/*.webp docs/assets/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate optimized Centaurix website images'
            git push origin HEAD:main
          fi
