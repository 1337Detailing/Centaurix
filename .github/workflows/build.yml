name: Centaurix Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keep stable debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: centaurix-android-debug-identity-v1
      - name: Test protocol against captured hardware response
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -2
      - uses: actions/upload-artifact@v4
        with:
          name: Centaurix-1.0.0-beta4
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
