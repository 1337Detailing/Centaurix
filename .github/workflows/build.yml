name: Centaurix Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Determine signing mode
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CENTAURIX_SIGNING_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.CENTAURIX_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$KEY_PASSWORD" ]]; then
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$KEYSTORE_B64" || -n "$KEY_PASSWORD" ]]; then
            echo "::error::Both permanent signing secrets must be set together."
            exit 1
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Tagged releases require permanent signing secrets."
              exit 1
            fi
            echo "permanent=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Using a temporary, cache-backed test signing identity. This is NOT secure permanent signing."
          fi

      - name: Restore temporary signing identity
        if: steps.signing.outputs.permanent == 'false'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/centaurix-ci-signing
          key: centaurix-temp-signing-identity-v1
          save-always: true

      - name: Initialize and pin temporary signing identity
        if: steps.signing.outputs.permanent == 'false'
        id: temporary
        shell: bash
        env:
          TEMP_DIR: ${{ runner.temp }}/centaurix-ci-signing
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$TEMP_DIR"
          KEY="$TEMP_DIR/centaurix.p12"
          PASS="$TEMP_DIR/password"
          PIN=".github/centaurix-temp-signing.sha256"
          if [[ ! -s "$KEY" || ! -s "$PASS" ]]; then
            if [[ -f "$PIN" ]]; then
              echo "::error::The temporary signing key was lost from the GitHub cache. Refusing to generate a different key and break APK updates."
              exit 1
            fi
            printf '%s' "$(openssl rand -hex 32)" > "$PASS"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KEY" \
              -alias centaurix -storepass "$(cat "$PASS")" -keypass "$(cat "$PASS")" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Centaurix CI Preview, O=Centaurix, C=FR"
          fi
          PASSWORD="$(cat "$PASS")"
          echo "::add-mask::$PASSWORD"
          FINGERPRINT="$(keytool -list -v -storetype PKCS12 -keystore "$KEY" \
            -storepass "$PASSWORD" -alias centaurix |
            awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to read signing certificate fingerprint."
            exit 1
          fi
          if [[ -f "$PIN" ]]; then
            EXPECTED="$(tr -d '[:space:]' < "$PIN")"
            if [[ "$FINGERPRINT" != "$EXPECTED" ]]; then
              echo "::error::Signing certificate mismatch; refusing to publish an incompatible update."
              exit 1
            fi
            echo "pinned=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pinned temporary signing certificate verified: $FINGERPRINT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            echo "::notice::INITIAL_TEMP_CERT_SHA256=$FINGERPRINT"
            echo "::notice::Initial key saved in GitHub Actions cache at end of this run. Publication starts after fingerprint is pinned."
          fi
          echo "CENTAURIX_KEYSTORE_FILE=$KEY" >> "$GITHUB_ENV"
          echo "CENTAURIX_SIGNING_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Decode permanent signing key
        if: steps.signing.outputs.permanent == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CENTAURIX_SIGNING_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.CENTAURIX_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/centaurix-release.p12"
          test -s "$RUNNER_TEMP/centaurix-release.p12"
          echo "CENTAURIX_KEYSTORE_FILE=$RUNNER_TEMP/centaurix-release.p12" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PASSWORD"
          echo "CENTAURIX_SIGNING_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare Android versionCode
        if: steps.signing.outputs.permanent == 'true' || steps.temporary.outputs.pinned == 'true'
        shell: bash
        run: |
          # GitHub run numbers are monotonically increasing for this workflow.
          echo "CENTAURIX_CI_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Validate permanent release tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.permanent == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match v$VERSION from app/build.gradle.kts."
            exit 1
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.permanent == 'true' || steps.temporary.outputs.pinned == 'true'
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and package APK
        if: steps.signing.outputs.permanent == 'true' || steps.temporary.outputs.pinned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          mkdir -p dist
          if [[ "${{ steps.signing.outputs.permanent }}" == "true" ]]; then
            cp "$APK" "dist/Centaurix-$VERSION.apk"
          else
            cp "$APK" "dist/Centaurix-TEMP.apk"
          fi
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )

      - name: Upload permanent signed APK artifact
        if: steps.signing.outputs.permanent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Centaurix-SIGNED-APK-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload temporary signed APK artifact
        if: steps.temporary.outputs.pinned == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Centaurix-TEMP-APK-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish public temporary beta APK
        if: steps.temporary.outputs.pinned == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view ci-preview >/dev/null 2>&1; then
            gh release create ci-preview --target "$GITHUB_SHA" --prerelease \
              --title "Centaurix Temporary Beta (test signature)" \
              --notes "Temporary CI-signed test APK. Not a production signature. Keep the same GitHub cache to update without uninstalling. If its key is lost, updates cannot be signed and publishing stops. Upgrading from earlier differently-signed APKs still requires a one-time reinstall."
          fi
          gh release upload ci-preview dist/Centaurix-TEMP.apk dist/SHA256SUMS.txt --clobber

      - name: Publish permanent signed GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.permanent == 'true'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove temporary signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/centaurix-release.p12"
